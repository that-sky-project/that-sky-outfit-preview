<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SKY-YIGUI-Web</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%231C2119'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='%23E8E2D0' font-family='serif'%3E%E6%9E%83%3C/text%3E%3C/svg%3E">
<style>
/* ============================================================
   Field Journal 主题 — 配色完全对齐第三个 HTML 的 wiki 主题
   ============================================================ */
:root {
  --wiki-accent: #B23A2E;
  --wiki-accent2: #8A9182;
  --wiki-bg: #1C2119;
  --wiki-bg2: #20261B;
  --wiki-border: rgba(232,226,208,0.22);
  --wiki-focus: #e0c39d;
  --wiki-muted: #8A9182;
  --wiki-panel: rgba(232,226,208,0.05);
  --wiki-panel2: rgba(232,226,208,0.09);
  --wiki-radius: 6px;
  --wiki-shadow: 0 20px 60px rgba(0,0,0,.34);
  --wiki-surface: #11100e;
  --wiki-text: #E8E2D0;
  --wiki-ease: cubic-bezier(.22,.75,.2,1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, html, body { height: 100%; }
body { display: flex; flex-direction: column; overflow: hidden; }
body {
  font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background:
    radial-gradient(1200px 600px at 50% -100px, rgba(178,58,46,.07), transparent 60%),
    radial-gradient(900px 500px at 100% 110%, rgba(224,195,157,.05), transparent 55%),
    var(--wiki-bg);
  color: var(--wiki-text);
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}
a { color: var(--wiki-focus); }

/* ── 页头 ── */
.wiki-head {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 20px;
  border-bottom: 1px solid var(--wiki-border);
  background: rgba(17,16,14,.6);
  flex: 0 0 auto;
}
.wiki-head-mark {
  width: 34px; height: 34px;
  border-radius: 8px;
  border: 1px solid rgba(232,226,208,.18);
  background: linear-gradient(160deg, #2E3722, #1C2119 70%);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  box-shadow: inset 0 0 12px rgba(0,0,0,.4);
}
.wiki-head-titles { min-width: 0; }
.wiki-head-title {
  font-size: 15px; font-weight: 700; letter-spacing: .02em;
  color: var(--wiki-text);
}
.wiki-head-sub {
  font-size: 11px; color: var(--wiki-muted); margin-top: 1px;
}
.wiki-head-stats {
  margin-left: auto; display: flex; gap: 8px; align-items: center;
  font-size: 11px; color: var(--wiki-muted); white-space: nowrap;
}
.wiki-stat-pill {
  border: 1px solid rgba(232,226,208,.14);
  background: var(--wiki-panel);
  border-radius: 99px;
  padding: 4px 10px;
}
.wiki-stat-pill b { color: var(--wiki-text); font-weight: 600; }

/* ── 主布局 ── */
.wiki-cosm-layout {
  flex: 1;
  min-height: 0;
  display: flex;
  justify-content: center;
  padding: 16px 16px 24px;
  max-width: 1200px;
  margin: 0 auto;
  width: 100%;
}
.wiki-cosm-stage {
  position: relative;
  display: flex;
  flex-direction: column;
  width: min(100%, 1200px);
  min-width: 0; min-height: 0;
  gap: 10px;
}
.wiki-cosm-main {
  display: flex; flex-direction: row;
  flex: 1; min-width: 0; min-height: 0;
  position: relative;
}

/* ── 3D 视口 ── */
.wiki-cosm-viewport {
  position: relative;
  flex: 1; min-width: 0;
  border-radius: var(--wiki-radius);
  border: 1px dashed var(--wiki-border);
  background:
    radial-gradient(circle at 50% 30%, rgba(36,41,31,.9), transparent 70%),
    linear-gradient(175deg, #20261B 0%, #1C2119 100%);
  overflow: hidden;
  box-shadow: 0 18px 50px rgba(0,0,0,.4);
}
#canvas {
  display: block; width: 100%; height: 100%;
  cursor: grab; touch-action: none; user-select: none;
}
#canvas:active { cursor: grabbing; }

/* 加载遮罩 */
.wiki-viewport-loading {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 14px;
  border-radius: var(--wiki-radius);
  background:
    radial-gradient(circle at 50% 30%, rgba(36,41,31,.94), transparent 70%),
    linear-gradient(175deg, #20261B 0%, #1C2119 100%);
  z-index: 50;
  opacity: 0; visibility: hidden;
  transition: opacity .22s var(--wiki-ease), visibility .22s var(--wiki-ease);
}
.wiki-viewport-loading.is-loading { opacity: 1; visibility: visible; }
.wiki-loading-ring {
  width: 46px; height: 46px; border-radius: 50%;
  border: 3px solid rgba(232,226,208,.12);
  border-top-color: var(--wiki-accent);
  animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.wiki-loading-text {
  font-size: 12px; color: var(--wiki-muted);
  letter-spacing: .06em;
}
.wiki-loading-text b { color: var(--wiki-focus); font-weight: 600; }

/* 视口工具按钮 */
.wiki-stage-tools {
  position: absolute; top: 10px; right: 10px;
  display: flex; gap: 6px; z-index: 30;
}
.wiki-view-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 34px; height: 34px;
  border-radius: 4px;
  border: 1px solid rgba(232,226,208,.18);
  background: rgba(17,16,14,.55);
  color: var(--wiki-text);
  font-size: 15px; line-height: 1;
  cursor: pointer;
  backdrop-filter: blur(4px);
  transition: background .15s, border-color .15s, transform .15s;
}
.wiki-view-btn:hover {
  background: rgba(232,226,208,.12);
  border-color: rgba(232,226,208,.35);
  transform: translateY(-1px);
}
.wiki-view-btn.is-active {
  border-color: rgba(178,58,46,.6);
  background: rgba(178,58,46,.2);
  box-shadow: 0 0 0 1.5px rgba(178,58,46,.3);
}
.wiki-view-btn--env.is-dawn { border-color: rgba(97,107,133,.7); }
.wiki-view-btn--env.is-day { border-color: rgba(255,242,220,.7); }
.wiki-view-btn--env.is-afternoon { border-color: rgba(255,173,89,.7); }
.wiki-view-btn--env.is-night { border-color: rgba(115,148,255,.7); }
.wiki-view-btn--label {
  width: auto; padding: 0 10px;
  font-size: 11px; font-weight: 700; letter-spacing: .04em;
  font-family: var(--wiki-font, inherit);
}
.wiki-view-btn--light.is-active {
  border-color: rgba(255,210,130,.6);
  background: rgba(255,190,80,.15);
  box-shadow: 0 0 0 1.5px rgba(255,210,130,.3);
}

/* 光影调节面板 */
.wiki-light-panel {
  position: absolute; top: 54px; right: 10px;
  width: 236px;
  z-index: 40;
  background: rgba(17,16,14,.88);
  border: 1px solid rgba(232,226,208,.2);
  border-radius: 6px;
  backdrop-filter: blur(8px);
  padding: 10px 12px 12px;
  box-shadow: 0 8px 30px rgba(0,0,0,.5);
  font-size: 12px;
}
.wiki-light-head {
  display: flex; align-items: center; justify-content: space-between;
  font-weight: 700; color: var(--wiki-text);
  margin-bottom: 8px; letter-spacing: .03em;
}
.wiki-light-close {
  width: 20px; height: 20px; line-height: 1;
  border: none; background: transparent; color: var(--wiki-muted);
  font-size: 15px; cursor: pointer; border-radius: 4px;
}
.wiki-light-close:hover { color: var(--wiki-text); background: rgba(232,226,208,.1); }
.wiki-light-row {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 7px;
}
.wiki-light-row label {
  width: 66px; flex-shrink: 0;
  color: rgba(232,226,208,.66); font-size: 11px;
}
.wiki-light-row input[type="range"] { flex: 1; min-width: 0; accent-color: #b23a2e; }
.wiki-light-row input[type="color"] {
  width: 34px; height: 22px; padding: 0; border: 1px solid rgba(232,226,208,.25);
  border-radius: 4px; background: transparent; cursor: pointer;
}
.wiki-light-val {
  width: 40px; text-align: right; flex-shrink: 0;
  color: rgba(232,226,208,.5); font-size: 10px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.wiki-light-actions {
  display: flex; gap: 6px; margin-top: 10px;
}
.wiki-light-btn {
  flex: 1; padding: 5px 0;
  border-radius: 4px;
  border: 1px solid rgba(232,226,208,.2);
  background: rgba(232,226,208,.06);
  color: var(--wiki-text); font-size: 11px; cursor: pointer;
  transition: background .12s, border-color .12s;
}
.wiki-light-btn:hover { background: rgba(232,226,208,.14); border-color: rgba(232,226,208,.4); }

.wiki-stage-hint {
  position: absolute; left: 12px; bottom: 10px;
  font-size: 11px; color: rgba(232,226,208,.45);
  z-index: 20; pointer-events: none;
  letter-spacing: .03em;
}

/* ── 右侧面板 ── */
.wiki-sky-panel {
  width: clamp(230px, 30%, 330px);
  min-width: 230px;
  flex-shrink: 0;
  display: flex; flex-direction: column;
  border-left: 1px solid rgba(232,226,208,.08);
  background: rgba(12,11,10,.6);
  overflow: hidden;
  border-radius: 0 var(--wiki-radius) var(--wiki-radius) 0;
  min-height: 0;
}
.wiki-panel-head {
  display: flex; align-items: center; gap: 8px;
  padding: 12px 12px 8px;
  flex: 0 0 auto;
}
.wiki-panel-title {
  font-size: 14px; font-weight: 700; color: var(--wiki-text);
  letter-spacing: .02em;
}
.wiki-panel-count {
  font-size: 11px; color: var(--wiki-muted);
  background: var(--wiki-panel);
  border: 1px solid rgba(232,226,208,.1);
  border-radius: 99px; padding: 2px 8px;
}
.wiki-cat-bar {
  display: flex; align-items: center;
  gap: 5px;
  padding: 4px 10px 8px;
  overflow-x: auto;
  flex: 0 0 auto;
  scrollbar-width: thin;
  scrollbar-color: rgba(178,58,46,.45) rgba(232,226,208,.05);
}
.wiki-cat-bar::-webkit-scrollbar { height: 5px; }
.wiki-cat-bar::-webkit-scrollbar-track { background: rgba(232,226,208,.05); border-radius: 99px; }
.wiki-cat-bar::-webkit-scrollbar-thumb { background: rgba(178,58,46,.45); border-radius: 99px; }
.wiki-cat-bar::-webkit-scrollbar-thumb:hover { background: rgba(178,58,46,.7); }
.wiki-cat-btn {
  position: relative;
  display: inline-flex; align-items: center; justify-content: center;
  width: 34px; height: 34px; min-height: 34px;
  aspect-ratio: 1; padding: 0;
  border-radius: 4px;
  border: 1px solid rgba(232,226,208,.12);
  background: rgba(232,226,208,.04);
  color: rgba(232,226,208,.72);
  cursor: pointer;
  transition: background .15s, border-color .15s, transform .15s, box-shadow .15s;
  flex: 0 0 auto;
}
.wiki-cat-btn:hover {
  color: var(--wiki-text);
  background: rgba(232,226,208,.1);
  border-color: rgba(232,226,208,.28);
  transform: translateY(-1px);
}
.wiki-cat-btn.is-active {
  background: rgba(178,58,46,.18);
  border-color: rgba(178,58,46,.55);
  color: var(--wiki-accent);
  box-shadow: 0 0 0 1.5px rgba(178,58,46,.3), inset 0 0 0 1px rgba(178,58,46,.25);
}
.wiki-cat-btn img { width: 70%; height: 70%; object-fit: contain; pointer-events: none; }
.wiki-cat-cnt {
  position: absolute; top: -5px; right: -5px;
  min-width: 15px; height: 15px; padding: 0 4px;
  border-radius: 99px;
  background: rgba(17,16,14,.85);
  border: 1px solid rgba(232,226,208,.16);
  font-size: 9px; line-height: 13px; text-align: center;
  color: var(--wiki-muted);
}

.wiki-search {
  padding: 2px 10px 8px;
  flex: 0 0 auto;
}
.wiki-search-input {
  width: 100%;
  padding: 7px 10px;
  border-radius: 4px;
  border: 1px solid rgba(232,226,208,.14);
  background: rgba(232,226,208,.05);
  color: var(--wiki-text);
  font-size: 12px;
  outline: none;
  transition: border-color .15s;
}
.wiki-search-input::placeholder { color: rgba(138,145,130,.7); }
.wiki-search-input:focus { border-color: rgba(178,58,46,.5); }

/* 图标网格 */
.wiki-icon-grid {
  flex: 1;
  overflow-y: auto;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(52px, 1fr));
  gap: 6px;
  padding: 8px;
  align-content: start;
  scrollbar-width: thin;
  scrollbar-color: rgba(232,226,208,.12) transparent;
}
.wiki-icon-grid::-webkit-scrollbar { width: 5px; }
.wiki-icon-grid::-webkit-scrollbar-thumb {
  background: rgba(232,226,208,.12); border-radius: 99px;
}
.wiki-icon-btn {
  position: relative;
  display: flex; align-items: center; justify-content: center;
  aspect-ratio: 1;
  border-radius: 4px;
  border: 1px solid rgba(232,226,208,.08);
  background: rgba(232,226,208,.04);
  cursor: pointer;
  transition: border-color .12s, background .12s, transform .12s;
  padding: 0;
}
.wiki-icon-btn:hover {
  background: rgba(232,226,208,.1);
  border-color: rgba(232,226,208,.25);
  transform: translateY(-1px);
}
.wiki-icon-btn.is-active {
  border-color: var(--wiki-accent);
  background: rgba(178,58,46,.15);
  box-shadow: 0 0 0 1.5px rgba(178,58,46,.35), inset 0 0 0 1px rgba(178,58,46,.3);
}
.wiki-icon-btn.is-none { opacity: .45; }
.wiki-icon-btn img { width: 74%; height: 74%; object-fit: contain; pointer-events: none; }
.wiki-grid-empty {
  grid-column: 1 / -1; text-align: center;
  padding: 22px 10px; color: var(--wiki-muted); font-size: 12px;
}
.wiki-grid-more {
  grid-column: 1 / -1;
  margin: 2px 0 0;
  padding: 8px;
  text-align: center;
  font-size: 11px;
  color: var(--wiki-text);
  background: rgba(232,226,208,.06);
  border: 1px solid rgba(232,226,208,.16);
  border-radius: 4px;
  cursor: pointer;
  transition: background .12s, border-color .12s;
}
.wiki-grid-more:hover {
  background: rgba(178,58,46,.16);
  border-color: rgba(178,58,46,.5);
  color: var(--wiki-accent);
}

/* 已穿列表 */
.wiki-worn-wrap {
  border-top: 1px solid var(--wiki-border);
  background: var(--wiki-bg2);
  flex: 0 0 auto;
  max-height: 132px;
  overflow-y: auto;
}
.wiki-worn-list {
  display: flex; flex-direction: column; gap: 5px;
  padding: 8px 10px;
}
.wiki-worn-empty {
  color: var(--wiki-muted); font-size: 12px;
  text-align: center; padding: 8px; opacity: .7;
}
.wiki-worn-item {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 8px;
  border-radius: 4px;
  border: 1px solid var(--wiki-border);
  background: var(--wiki-panel);
  transition: background .12s;
}
.wiki-worn-item:hover { background: var(--wiki-panel2); }
.wiki-worn-icon {
  position: relative; width: 34px; height: 34px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 6px;
  border: 1px solid var(--wiki-border);
  background: var(--wiki-panel);
  flex-shrink: 0;
}
.wiki-worn-icon img { width: 74%; height: 74%; object-fit: contain; }
.wiki-worn-info { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; }
.wiki-worn-cat {
  font-size: 10px; color: var(--wiki-muted);
  border: 1px solid rgba(232,226,208,.12);
  border-radius: 99px; padding: 1px 7px; white-space: nowrap;
}
.wiki-worn-name {
  font-weight: 600; font-size: 12px; color: var(--wiki-text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.wiki-worn-remove {
  width: 22px; height: 22px; flex-shrink: 0;
  border: none; border-radius: 4px;
  background: transparent; color: var(--wiki-muted);
  font-size: 14px; line-height: 1; cursor: pointer;
  transition: background .12s, color .12s;
}
.wiki-worn-remove:hover { background: rgba(178,58,46,.2); color: var(--wiki-text); }

/* 页脚 */
.wiki-foot {
  flex: 0 0 auto;
  text-align: center;
  font-size: 11px;
  color: rgba(138,145,130,.8);
  padding: 10px 16px 14px;
  border-top: 1px solid rgba(232,226,208,.08);
}

/* 竖版模式 */
.wiki-cosm-stage--portrait { flex-direction: column; width: min(100%, 420px); }
.wiki-cosm-stage--portrait .wiki-cosm-main { flex-direction: column; }
.wiki-cosm-stage--portrait .wiki-sky-panel {
  width: 100%; max-height: 220px;
  border-radius: 0 0 var(--wiki-radius) var(--wiki-radius);
  border-left: none; border-top: 1px solid var(--wiki-border);
}
.wiki-cosm-stage--portrait .wiki-cosm-viewport {
  aspect-ratio: 9 / 16;
  border-radius: var(--wiki-radius) var(--wiki-radius) 0 0;
}

/* 移动端 */
@media (max-width: 768px) {
  .wiki-head-stats { display: none; }
  .wiki-head { padding: 10px 12px; gap: 10px; }
  .wiki-head-mark { font-size: 16px; }
  .wiki-head-title { font-size: 13px; }
  .wiki-head-sub { display: none; }
  .wiki-cosm-layout { padding: 8px 6px 12px; flex-direction: column; }
  .wiki-cosm-stage { width: 100%; gap: 6px; flex: 1; min-height: 0; }
  .wiki-cosm-main { flex-direction: column; flex: 1; min-height: 0; }
  .wiki-cosm-viewport { flex: none; height: 42dvh; min-height: 240px; }
  .wiki-sky-panel {
    width: 100%; min-width: 0;
    flex: 1;
    border-left: none;
    border-top: 1px solid rgba(232,226,208,.08);
    border-radius: 0 0 var(--wiki-radius) var(--wiki-radius);
  }
  .wiki-panel-head { padding: 8px 10px 6px; }
  .wiki-cat-bar { padding: 2px 8px 6px; }
  .wiki-search { padding: 2px 8px 6px; }
  .wiki-icon-grid { grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 5px; }
  .wiki-worn-list { max-height: 128px; overflow-y: auto; }
  .wiki-stage-hint { display: none; }
}
</style>
</head>
<body>

<header class="wiki-head">
  <div class="wiki-head-mark">🕯️</div>
  <div class="wiki-head-titles">
    <div class="wiki-head-title">SKY-YIGUI-Web</div>
    <div class="wiki-head-sub">Children of the Light — 本地模型直载，无需导入安装包</div>
  </div>
  <div class="wiki-head-stats">
    <span class="wiki-stat-pill" id="statItems">物品 <b id="catCount">…</b></span>
    <span class="wiki-stat-pill">模型 <b>1029</b></span>
    <span class="wiki-stat-pill">环境 <b id="envLabel">白天</b></span>
  </div>
</header>

<main class="wiki-cosm-layout">
  <section class="wiki-cosm-stage">
    <div class="wiki-cosm-main">

      <!-- 3D 视口 -->
      <div class="wiki-cosm-viewport">
        <canvas id="canvas"></canvas>
        <div class="wiki-stage-tools">
          <button id="btnEnv" class="wiki-view-btn wiki-view-btn--env is-day" title="切换环境光照预设">🌗</button>
          <button id="btnLight" class="wiki-view-btn wiki-view-btn--light" title="自由调节光影">☀</button>
          <button id="btnSpin" class="wiki-view-btn is-active" title="旋转/停止">⟳</button>
          <button id="btnReset" class="wiki-view-btn" title="重置视角">◎</button>
          <button id="btnAspect" class="wiki-view-btn" title="横竖版切换">⛶</button>
          <button id="btnExportObj" class="wiki-view-btn wiki-view-btn--label" title="导出当前穿搭为 OBJ（含贴图，zip）">导出OBJ</button>
          <button id="btnExportGlb" class="wiki-view-btn wiki-view-btn--label" title="导出当前穿搭为带骨骼 GLB（当前站姿，可编辑）">导出GLB</button>
           <button id="btnExportPmx" class="wiki-view-btn wiki-view-btn--label" title="导出当前穿搭为 MMD PMX（含骨骼，zip）">导出PMX</button>
        </div>
        <div class="wiki-stage-hint">拖拽旋转 · 滚轮缩放 · 右键平移</div>
        <div class="wiki-viewport-loading">
          <div class="wiki-loading-ring"></div>
          <div class="wiki-loading-text">正在穿衣服… <b>构建角色模型</b></div>
        </div>
      </div>

      <!-- 右侧面板 -->
      <aside class="wiki-sky-panel">
        <div class="wiki-panel-head">
          <span class="wiki-panel-title">服装</span>
          <span class="wiki-panel-count" id="panelCount">0</span>
        </div>
        <div class="wiki-cat-bar"></div>
        <div class="wiki-search">
          <input class="wiki-search-input" type="search" placeholder="搜索物品…" autocomplete="off">
        </div>
        <div class="wiki-icon-grid"></div>
        <div class="wiki-worn-wrap">
          <div class="wiki-worn-list"></div>
        </div>
      </aside>

    </div>
  </section>
</main>

<script src="js/three.min.js?v=20260909axam"></script>
<script src="js/OrbitControls.js?v=20260909axam"></script>
